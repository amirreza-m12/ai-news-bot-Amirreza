name: Post AI News

on:
  schedule:
    # هر ۲۰ دقیقه — زمان‌ها به وقت UTC هستن
    - cron: "46 11 * * *"
  # اجرای دستی از پنل GitHub
  workflow_dispatch:

# اجازه آپدیت کردن فایل تاریخچه توی ریپو
permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: اجرای ربات
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: ذخیره تاریخچه خبرهای پست‌شده
        run: |
          git config user.name "amirreza-m12"
          git config user.email "297484386+amirreza-m12@users.noreply.github.com"
          git add posted_history.json
          if git diff --cached --quiet; then
            echo "تغییری نداشت"
          else
            git commit -m "chore: update posted history"
            git push
          fi
