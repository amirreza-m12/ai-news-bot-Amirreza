name: Daily Summary

on:
  # زمان‌بندی با cron-job.org روی ساعت ۰۰:۳۰ به وقت تهران انجام می‌شود
  workflow_dispatch:

# اجازه آپدیت کردن فایل لاگ روزانه توی ریپو
permissions:
  contents: write

# جلوی اجرای همزمان دو خلاصه رو می‌گیره
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: ارسال خلاصه روز
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROUTER_BASE_URL: ${{ secrets.ROUTER_BASE_URL }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          ROUTER_MODEL: ${{ secrets.ROUTER_MODEL }}
        run: python summary.py

      - name: ذخیره وضعیت خلاصه
        run: |
          git config user.name "amirreza-m12"
          git config user.email "297484386+amirreza-m12@users.noreply.github.com"
          git add daily 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "تغییری نداشت"
          else
            git commit -m "chore: mark daily summary as sent"
            git pull --rebase origin main || git rebase --abort || true
            git push
          fi
